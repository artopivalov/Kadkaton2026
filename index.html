<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kadkaton — prototype</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="menu" class="menu">
<h1>Kadkaton</h1><p>Prototype · 2D</p>
<canvas id="character-preview" width="160" height="110" role="img" aria-label="Character preview"></canvas>
<form id="start-form">
<label for="name">Wizard name</label><input id="name" maxlength="24" placeholder="Wizard" autocomplete="nickname">
<label for="color">Character color</label><input id="color" type="color" value="#79a9ff">
<button type="submit">Play</button>
<button type="button" id="host-game">Host game</button>
<button type="button" id="join-game">Join game</button>
</form>
<small id="menu-hint">Online play needs the matchmaking server: run "npm run server" and open the game from its address.</small>
<p id="menu-message" role="alert"></p>
<section id="net-panel" hidden aria-labelledby="net-title">
<h2 id="net-title"></h2>
<div id="net-host" hidden>
<label for="room-name">Room name</label><input id="room-name" maxlength="24" placeholder="My game">
<label for="room-max">Maximum players</label><select id="room-max"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
<button type="button" id="room-create">Create room</button>
</div>
<div id="net-join" hidden><ul id="room-list" aria-live="polite"></ul><p id="room-empty"></p></div>
<p id="net-status" role="alert"></p>
<button type="button" id="net-back">Back</button>
</section>
</main>
<section id="game" hidden aria-label="Lobby">
<canvas id="canvas" aria-label="Lobby with a wizard, wands and training dummies"></canvas>
<header class="hud"><button id="exit">Menu</button></header>

<div id="status-hud">
<div id="debug-tools" hidden><label>Item rarity <select id="rarity"></select></label><label>Rune effect<select id="rune-effect"><option value="random">Random</option></select></label><label>Enemy<select id="enemy-type"></select></label><button id="spawn-enemy">Spawn enemy</button><button id="clear-enemies">Clear enemies</button></div>
</div>
<label id="zoom-control">Zoom<input id="zoom" type="range" min="0.35" max="1.25" step="any" value="0.72" aria-label="Camera zoom" aria-orientation="vertical"></label>
<div id="generation-tools" hidden><label for="location">Location<select id="location"><option value="forest">Forest</option><option value="cave">Cave</option><option value="library">Library</option></select></label><label for="seed">Seed<input id="seed" type="number" min="0" max="4294967295" value="1"></label><button id="regenerate">Regenerate</button><span id="map-stats"></span></div>
<button id="retry" hidden>Return to lobby</button>
<div id="notice" role="status" aria-live="polite"></div>
<div id="joystick" hidden role="application" aria-label="Movement and charging joystick"><div id="stick"></div></div>
<div class="controls">
<div id="mode-slider" role="slider" tabindex="0" aria-label="Wand mode" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" aria-valuetext="Safe">
<div class="mode-track"></div><div id="mode-thumb"></div><span class="mode-label special">Special</span><span class="mode-label normal">Normal</span><span class="mode-label safe">Safe</span>
</div>

<div class="inventory"><button id="wand-slot"></button><button id="rune-slot" aria-label="Rune slot: empty"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 32 20 20 35 8 20Z" fill="none" stroke="currentColor" stroke-width="3"/></svg><small>Empty rune</small></button></div>
</div>

</section>
<script type="module" src="src/main.js"></script>
</body></html>
